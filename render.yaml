services:
  - type: web
    name: mplads-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mplads-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: mplads-db
    databaseName: mplads
    user: mplads
